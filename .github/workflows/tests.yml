name: tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

# CI runs on every push to main and feature branches.
# Keep the test database isolated from the runner filesystem permissions.

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: ${{ runner.temp }}/medical_diary_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile drug_reference.py reminders.py db.py drugdb/loader.py drugdb/runner.py mdlp_parser.py mdlp_client.py
      - run: python -m unittest discover -s tests -p "test_*.py"

  drugdb-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_diary
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d medical_diary"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DRUG_DB_DSN: postgresql://postgres:postgres@localhost:5432/medical_diary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Initialize PostgreSQL schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d medical_diary -v ON_ERROR_STOP=1 -f drugdb/schema.sql
      - name: Run drug reference integration tests
        run: python -m unittest tests.test_drugdb_integration
