services:
  mdlp-updater:
    build: .
    container_name: ${MDLP_UPDATER_CONTAINER_NAME:-medical-diary-mdlp-updater}
    environment:
      TZ: ${TZ:-Europe/Moscow}
      MDLP_REFERENCE_DB: /reference/mdlp_reference.db
      MDLP_EXPORT_URL: ${MDLP_EXPORT_URL:-https://xn--80aaani3am7aog.xn--80ajghhoc2aj1c8b.xn--p1ai/bi/api/opendata/7731376812-MDLPGtins/data/data-20260923-structure-20240611.csv}
      MDLP_UPDATE_INTERVAL_SECONDS: ${MDLP_UPDATE_INTERVAL_SECONDS:-604800}
    restart: unless-stopped
    volumes:
      - ./mdlp_reference_data:/reference
    command: ["python", "/app/mdlp_runner.py"]

  app:
    container_name: ${CONTAINER_NAME:-medical-diary-app}
    build: .
    environment:
      TZ: ${TZ:-Europe/Moscow}
      MDLP_REFERENCE_DB: /reference/mdlp_reference.db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./mdlp_reference_data:/reference:ro
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
      - ./app.py:/app/app.py:ro
      - ./validators.py:/app/validators.py:ro
      - ./ai_utils.py:/app/ai_utils.py:ro
      - ./db.py:/app/db.py:ro
      - ./security.py:/app/security.py:ro
      - ./reminders.py:/app/reminders.py:ro
      - ./mdlp_parser.py:/app/mdlp_parser.py:ro
      - ./mdlp_reference.py:/app/mdlp_reference.py:ro
      - ./drug_reference.py:/app/drug_reference.py:ro
      - ./assessments.py:/app/assessments.py:ro
      - ./pdf_export.py:/app/pdf_export.py:ro
      - ./backup.py:/app/backup.py:ro
      - ./reset_admin_password.py:/app/reset_admin_password.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
