services:
  medical-diary:
    build: .
    container_name: medical-diary_v2
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
